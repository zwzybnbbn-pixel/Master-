<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دار الناصر | أفخم العطورات العالمية</title>
    <meta name="description" content="دار الناصر للعطور الفاخرة - تجسيد الأناقة والتميز في عالم العطور">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f4e4a6;
            --gold-dark: #b8941f;
            --black: #0a0a0a;
            --black-light: #1a1a1a;
            --white: #ffffff;
            --gray: #8a8a8a;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
        }

        .loading-logo {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Header */
        .main-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--gold);
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 2rem;
        }

        #auth-status {
            font-size: 1rem;
            color: var(--gray);
        }

        /* Hero Section */
        .hero-section {
            min-height: 60vh;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&q=80&w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 5% 60px;
        }

        .hero-title {
            font-family: 'Amiri', serif;
            font-size: 4.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 40px;
        }

        /* Products Grid */
        .products-container {
            padding: 80px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 60px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 3px;
            background: var(--gold);
            margin: 15px auto;
        }

        #products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        /* Product Card */
        .product-card {
            background: var(--black-light);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-10px);
            box-shadow: var(--shadow);
        }

        .product-image-container {
            height: 320px;
            overflow: hidden;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
            padding: 20px;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: var(--black);
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            z-index: 1;
        }

        .product-content {
            padding: 25px;
            text-align: center;
        }

        .product-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--white);
            margin-bottom: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-price {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: bold;
            margin: 15px 0;
        }

        .product-cta {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 8px;
            margin-top: 15px;
        }

        .product-cta:hover {
            background: var(--gold);
            color: var(--black);
        }

        /* Footer */
        .main-footer {
            background: #000;
            padding: 60px 5%;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
            margin-top: 80px;
        }

        .footer-logo {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .footer-text {
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero-title {
                font-size: 3.5rem;
            }
            
            #products-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.8rem;
            }
            
            .section-title {
                font-size: 2.5rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.2rem;
            }
            
            #products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-crown"></i>
                <span>الناصر</span>
            </div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-crown logo-icon"></i>
                <span>دار الناصر</span>
            </a>
            <div id="auth-status"></div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">الناصر للعطور الفاخرة</h1>
            <p class="hero-subtitle">تجسيد للتراث والأناقة في كل زجاجة، مصممة خصيصًا لأصحاب الذوق الرفيع</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="products-container">
        <h2 class="section-title">مجموعتنا المميزة</h2>
        <div id="products-grid">
            <!-- سيتم إضافة المنتجات بواسطة JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-logo">الناصر</div>
        <p class="footer-text">دار الناصر للعطور الفاخرة © 2024. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- JavaScript -->
    <script type="module">
        // استيراد Supabase
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        // إعداد العميل
        const supabaseUrl = 'https://nqothizwtmvbvyrxoguz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xb3RoaXp3dG12YnZ5cnhvZ3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMjc2ODEsImV4cCI6MjA4MjYwMzY4MX0.Hah1FyYJT-dQI0byUO7pNKB3NZqzkyICPh_0D_zdzis';
        const supabase = createClient(supabaseUrl, supabaseKey);
        
        // عناصر DOM
        const productsGrid = document.getElementById('products-grid');
        const loadingScreen = document.getElementById('loading-screen');
        const authStatus = document.getElementById('auth-status');

        // إخفاء شاشة التحميل
        function hideLoadingScreen() {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        // إنشاء بطاقة منتج آمنة
        function createProductCard(product) {
            // إنشاء العناصر الرئيسية
            const card = document.createElement('article');
            card.className = 'product-card';
            card.dataset.id = product.id;
            
            // إضافة شارة التميز إذا كان المنتج مميزاً
            if (product.is_featured) {
                const badge = document.createElement('div');
                badge.className = 'product-badge';
                badge.textContent = 'تميز';
                card.appendChild(badge);
            }
            
            // حاوية الصورة
            const imageContainer = document.createElement('div');
            imageContainer.className = 'product-image-container';
            
            const img = document.createElement('img');
            img.className = 'product-image';
            img.src = product.image_url;
            img.alt = product.name;
            img.loading = 'lazy';
            
            imageContainer.appendChild(img);
            
            // محتوى البطاقة
            const content = document.createElement('div');
            content.className = 'product-content';
            
            const title = document.createElement('h3');
            title.className = 'product-title';
            title.textContent = product.name;
            
            const price = document.createElement('div');
            price.className = 'product-price';
            price.textContent = `${product.price} ر.س`;
            
            const button = document.createElement('button');
            button.className = 'product-cta';
            button.textContent = 'عرض التفاصيل';
            button.addEventListener('click', () => {
                window.location.href = `details.html?id=${product.id}`;
            });
            
            content.appendChild(title);
            content.appendChild(price);
            content.appendChild(button);
            
            // تجميع البطاقة
            card.appendChild(imageContainer);
            card.appendChild(content);
            
            return card;
        }

        // عرض المنتجات
        function renderProducts(products) {
            // تنظيف الحاوية
            while (productsGrid.firstChild) {
                productsGrid.removeChild(productsGrid.firstChild);
            }
            
            // إضافة كل منتج مع تأخير للأنيميشن
            products.forEach((product, index) => {
                const card = createProductCard(product);
                card.style.animationDelay = `${index * 0.1}s`;
                productsGrid.appendChild(card);
            });
        }

        // جلب المنتجات من قاعدة البيانات
        async function loadProducts() {
            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw error;
                }
                
                renderProducts(products);
                hideLoadingScreen();
            } catch (error) {
                console.error('Error loading products:', error);
                
                // عرض رسالة خطأ في الواجهة
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.style.cssText = `
                    text-align: center;
                    padding: 40px;
                    color: #ff6b6b;
                    font-size: 1.2rem;
                `;
                errorDiv.textContent = 'حدث خطأ في تحميل المنتجات. يرجى المحاولة مرة أخرى.';
                
                productsGrid.appendChild(errorDiv);
                hideLoadingScreen();
            }
        }

        // التحقق من حالة المصادقة
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                authStatus.textContent = `مرحباً، ${user.email}`;
                authStatus.style.color = 'var(--gold)';
            } else {
                authStatus.textContent = 'زائر';
            }
        }

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadProducts();
        });

        // إضافة تأثيرات عند التمرير
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // مراقبة المنتجات الجديدة
        setTimeout(() => {
            document.querySelectorAll('.product-card').forEach(card => {
                observer.observe(card);
            });
        }, 1000);
    </script>
</body>
</html>
